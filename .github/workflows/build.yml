name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Verify pre-installed Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "--- platforms:"
          ls $ANDROID_HOME/platforms || echo "none"
          echo "--- build-tools:"
          ls $ANDROID_HOME/build-tools || echo "none"

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses 2>&1 | tail -5 || true
          else
            echo "sdkmanager not found, skipping"
          fi

      - name: Ensure SDK packages (android-34)
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -10 || true
          fi
          echo "--- after install, platforms:"
          ls $ANDROID_HOME/platforms || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
