# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Network resilience (Iran)
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.org.gradle.internal.repository.initial.backoff=1000

# --- JVM / Dexing (conservative - avoids OOM) ---
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=daemon
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
android.enableJetifier=false